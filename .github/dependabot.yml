# Dependabot configuration for nginx-defender
# Keeps dependencies updated across Go, Python, Node.js, Docker, and GitHub Actions

version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    target-branch: "main"
    open-pull-requests-limit: 5
    reviewers:
      - "Anipaleja"
    assignees:
      - "Anipaleja"
    labels:
      - "dependencies"
      - "go"
      - "security"

  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/bindings/python"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/New_York"
    target-branch: "main"
    open-pull-requests-limit: 5
    reviewers:
      - "Anipaleja"
    assignees:
      - "Anipaleja"
    labels:
      - "dependencies"
      - "python"
      - "bindings"

  # Node.js dependencies
  - package-ecosystem: "npm"
    directory: "/bindings/nodejs"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "America/New_York"
    target-branch: "main"
    open-pull-requests-limit: 5
    reviewers:
      - "Anipaleja"
    assignees:
      - "Anipaleja"
    labels:
      - "dependencies"
      - "nodejs"
      - "bindings"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "America/New_York"
    target-branch: "main"
    open-pull-requests-limit: 3
    reviewers:
      - "Anipaleja"
    assignees:
      - "Anipaleja"
    labels:
      - "dependencies"
      - "docker"
      - "infrastructure"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "10:00"
      timezone: "America/New_York"
    target-branch: "main"
    open-pull-requests-limit: 3
    reviewers:
      - "Anipaleja"
    assignees:
      - "Anipaleja"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
