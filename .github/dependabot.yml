# Dependabot configuration for nginx-defender
# Keeps dependencies updated across Go, Python, Node.js, Docker, and GitHub Actions

version: 2
updates:
  # Core Go project - highest priority
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 8
    reviewers:
      - "Anipaleja"
    assignees:
      - "Anipaleja"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
      - "security"
    # Group security updates together
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      go-major-updates:
        patterns:
          - "golang.org/x/*"
          - "github.com/sirupsen/logrus"
          - "github.com/gorilla/*"
        update-types:
          - "major"

  # Library package - critical for users
  - package-ecosystem: "gomod"
    directory: "/lib"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    reviewers:
      - "Anipaleja"
    assignees:
      - "Anipaleja"
    commit-message:
      prefix: "deps(lib)"
      include: "scope"
    labels:
      - "dependencies"
      - "library"
      - "go"

  # Python bindings
  - package-ecosystem: "pip"
    directory: "/bindings/python"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    reviewers:
      - "Anipaleja"
    assignees:
      - "Anipaleja"
    commit-message:
      prefix: "deps(python)"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
      - "bindings"
    allow:
      # Be conservative with Python updates
      - dependency-type: "direct"
      - dependency-type: "indirect"
    groups:
      flask-ecosystem:
        patterns:
          - "flask*"
          - "werkzeug"
          - "jinja2"
      django-ecosystem:
        patterns:
          - "django*"
          - "djangorestframework"

  # Node.js bindings
  - package-ecosystem: "npm"
    directory: "/bindings/nodejs"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    reviewers:
      - "Anipaleja"
    assignees:
      - "Anipaleja"
    commit-message:
      prefix: "deps(nodejs)"
      include: "scope"
    labels:
      - "dependencies"
      - "nodejs"
      - "bindings"
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "typescript"
          - "jest"
        dependency-type: "development"
      runtime-dependencies:
        patterns:
          - "axios"
          - "*"
        dependency-type: "production"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    reviewers:
      - "Anipaleja"
    assignees:
      - "Anipaleja"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
      - "infrastructure"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "10:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    reviewers:
      - "Anipaleja"
    assignees:
      - "Anipaleja"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"

  # Example projects (less frequent updates)
  - package-ecosystem: "gomod"
    directory: "/examples/basic"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    reviewers:
      - "Anipaleja"
    commit-message:
      prefix: "deps(examples)"
      include: "scope"
    labels:
      - "dependencies"
      - "examples"

  - package-ecosystem: "gomod"
    directory: "/examples/advanced"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    reviewers:
      - "Anipaleja"
    commit-message:
      prefix: "deps(examples)"
      include: "scope"
    labels:
      - "dependencies"
      - "examples"

  - package-ecosystem: "gomod"
    directory: "/examples/middleware"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    reviewers:
      - "Anipaleja"
    commit-message:
      prefix: "deps(examples)"
      include: "scope"
    labels:
      - "dependencies"
      - "examples"
