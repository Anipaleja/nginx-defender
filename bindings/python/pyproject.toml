[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nginx-defender"
version = "2.0.0"
authors = [
    {name = "nginx-defender team", email = "support@nginx-defender.com"},
]
description = "Web Application Firewall and threat detection for Python applications"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Security",
    "Topic :: System :: Networking :: Firewalls",
]
keywords = ["waf", "security", "firewall", "threat-detection", "nginx", "protection"]
dependencies = [
    "requests>=2.25.0",
    "typing-extensions>=4.0.0; python_version<'3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/Anipaleja/nginx-defender"
"Bug Reports" = "https://github.com/Anipaleja/nginx-defender/issues"
"Source" = "https://github.com/Anipaleja/nginx-defender"
"Documentation" = "https://github.com/Anipaleja/nginx-defender/docs"

[project.scripts]
nginx-defender = "nginx_defender:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
